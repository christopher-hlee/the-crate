appId: ${APP_ID}
name: Favorite a pick and find it in Favorites (dev sign-in build, Free plan)
---
- launchApp:
    clearState: true
- tapOn:
    id: tab-account
- tapOn:
    id: sign-in
- tapOn:
    id: dev-sign-in
- tapOn:
    id: tab-dig
- extendedWaitUntil:
    notVisible: Finding a record
    timeout: 20000
# Free has no crates: Save offers a favorite instead of a crate form.
- tapOn:
    id: save
- assertVisible: Crates are a Pro tool — favorite records instead.
- tapOn:
    id: save-favorite
- extendedWaitUntil:
    visible: In your favorites
    timeout: 10000
# On Free, a long-press on the card favorites too; this pick is already in.
- longPressOn:
    id: pick-card
- extendedWaitUntil:
    visible: Already in your favorites.
    timeout: 10000
- tapOn:
    id: tab-favorites
- assertVisible:
    id: player-webview
- assertVisible:
    id: item-0
# Crates are a Pro tool; the tab explains that favorites are free.
- tapOn:
    id: tab-crates
- assertVisible:
    id: crates-upsell
