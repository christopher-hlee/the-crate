# Postgres for local development and tests. The dev database is "crate"; integration
# tests create and drop their own databases using the same superuser.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crate
      POSTGRES_PASSWORD: crate
      POSTGRES_DB: crate
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
